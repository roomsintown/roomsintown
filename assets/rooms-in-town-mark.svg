<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Rooms in Town roofline mark</title>
  <desc id="desc">A cream line drawing of connected town houses, using varied line weights to give the roofs, windows and doors depth.</desc>

  <g fill="none" stroke="#f4ede3" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Outer walls and flat roof sections -->
    <path stroke-width="11" d="M28 218V157H74 M47 157V117H102 M506 211V142H580V218"/>
    <path stroke-width="7" d="M74 157V218"/>

    <!-- Roofline: lighter rising edges, heavier right-hand falls -->
    <path stroke-width="10" d="M102 117L132 145"/>
    <path stroke-width="8" d="M132 145L188 77 M269 163L361 44"/>
    <path stroke-width="16" d="M188 77L269 163 M361 44L506 211"/>

    <!-- Larger openings: heavier left and top edges, lighter right edges -->
    <g stroke-width="13">
      <path d="M91 218V180H133"/>
      <path d="M209 218V160H254"/>
      <path d="M319 218V183H359"/>
      <path d="M434 218V163H476"/>
      <path d="M535 218V180H577"/>
    </g>
    <g stroke-width="7">
      <path d="M133 180V218"/>
      <path d="M254 160V218"/>
      <path d="M359 183V218"/>
      <path d="M476 163V218"/>
      <path d="M577 180V218"/>
    </g>

    <!-- Smaller windows: the top and left catch more visual weight -->
    <g stroke-width="12">
      <path d="M147 218V187H173"/>
      <path d="M280 218V193H305"/>
      <path d="M380 218V175H409"/>
      <path d="M494 218V190H519"/>
    </g>
    <g stroke-width="6">
      <path d="M173 187V218"/>
      <path d="M305 193V218"/>
      <path d="M409 175V218"/>
      <path d="M519 190V218"/>
    </g>

    <!-- Raised roof details use the same weighted-edge treatment -->
    <g stroke-width="12">
      <path d="M114 119V83H161"/>
      <path d="M405 96V53H460"/>
    </g>
    <g stroke-width="7">
      <path d="M161 83V131"/>
      <path d="M460 53V157"/>
    </g>
  </g>
</svg>
