<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rooms in Town — a new website is taking shape.">
  <meta name="theme-color" content="#74221b">
  <title>Rooms in Town</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --wine: #74221b;
      --wine-deep: #561611;
      --wine-light: #934337;
      --cream: #eee7dc;
      --paper: #f7f2ea;
      --ink: #241b18;
      --serif: "Bodoni Moda", Didot, "Times New Roman", serif;
      --sans: Manrope, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--wine-deep); }

    body {
      min-height: 100svh;
      margin: 0;
      color: var(--cream);
      background:
        radial-gradient(circle at 80% 15%, rgba(255,255,255,.06), transparent 25rem),
        linear-gradient(120deg, var(--wine-deep), var(--wine) 42%, #812c24 74%, var(--wine-deep));
      font-family: var(--sans);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .shell {
      position: relative;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      isolation: isolate;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(1.4rem, 3vw, 2.6rem) clamp(1.3rem, 5vw, 5.5rem);
      border-bottom: 1px solid rgba(247, 242, 234, .22);
    }

    .wordmark {
      font-family: var(--serif);
      font-size: clamp(1.15rem, 1.8vw, 1.55rem);
      font-weight: 400;
      letter-spacing: .15em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      color: rgba(247, 242, 234, .74);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .status::before {
      content: "";
      width: .45rem;
      height: .45rem;
      border-radius: 50%;
      background: var(--cream);
      box-shadow: 0 0 0 .28rem rgba(247, 242, 234, .12);
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(18rem, .9fr);
      align-items: stretch;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(4rem, 9vw, 9rem) clamp(1.3rem, 7vw, 8rem);
    }

    .eyebrow {
      margin: 0 0 1.7rem;
      color: rgba(247, 242, 234, .7);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 8.2ch;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(4rem, 9vw, 9.6rem);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: .82;
      text-wrap: balance;
    }

    .intro {
      max-width: 37rem;
      margin: clamp(2rem, 4vw, 3.3rem) 0 0;
      color: rgba(247, 242, 234, .82);
      font-size: clamp(1rem, 1.35vw, 1.2rem);
      line-height: 1.8;
      text-wrap: pretty;
    }

    .brand-panel {
      position: relative;
      min-height: 34rem;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      border-left: 1px solid rgba(247, 242, 234, .22);
      background:
        linear-gradient(180deg, rgba(247, 242, 234, .08), transparent 50%),
        rgba(58, 12, 9, .2);
    }

    .brand-panel::before,
    .brand-panel::after {
      content: "";
      position: absolute;
      width: 1px;
      height: 125%;
      background: rgba(247, 242, 234, .16);
      transform: rotate(42deg);
      transform-origin: bottom;
    }

    .brand-panel::before { right: 29%; bottom: -20%; }
    .brand-panel::after { right: 57%; bottom: -32%; }

    .mark-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: clamp(2rem, 5vw, 5.5rem) clamp(1.7rem, 4.8vw, 5rem) clamp(1.8rem, 4vw, 4rem);
    }

    .mark-wrap img {
      display: block;
      width: min(100%, 42rem);
      height: auto;
      filter: drop-shadow(0 1rem 2rem rgba(38, 6, 4, .22));
    }

    .caption {
      margin: 1.25rem 0 0;
      color: rgba(247, 242, 234, .6);
      font-size: .68rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem clamp(1.3rem, 5vw, 5.5rem);
      border-top: 1px solid rgba(247, 242, 234, .22);
      color: rgba(247, 242, 234, .55);
      font-size: .66rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    @media (max-width: 820px) {
      .topbar { align-items: flex-start; }
      .status { margin-top: .25rem; font-size: .62rem; }
      main { grid-template-columns: 1fr; }
      .hero-copy { min-height: 57svh; }
      h1 { max-width: 7ch; font-size: clamp(4.2rem, 19vw, 7.6rem); }
      .brand-panel {
        min-height: 24rem;
        border-top: 1px solid rgba(247, 242, 234, .22);
        border-left: 0;
      }
      footer { flex-direction: column; }
    }

    @media (max-width: 480px) {
      .wordmark { max-width: 11ch; white-space: normal; line-height: 1.25; }
      .status { max-width: 9rem; text-align: right; line-height: 1.5; }
      .hero-copy { padding-top: 4.5rem; padding-bottom: 4.5rem; }
      .intro { line-height: 1.65; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero-copy > * { animation: arrive .8s cubic-bezier(.22, 1, .36, 1) both; }
      .hero-copy h1 { animation-delay: .08s; }
      .hero-copy .intro { animation-delay: .16s; }
      .mark-wrap { animation: rise 1s .16s cubic-bezier(.22, 1, .36, 1) both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(1.2rem); } }
      @keyframes rise { from { opacity: 0; transform: translateY(2rem); } }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="wordmark">Rooms in Town</div>
      <div class="status">Website coming soon</div>
    </header>

    <main>
      <section class="hero-copy" aria-labelledby="page-title">
        <p class="eyebrow">A place is taking shape</p>
        <h1 id="page-title">Rooms in Town</h1>
        <p class="intro">We’re building a new home online. More information will be available here soon.</p>
      </section>

      <section class="brand-panel" aria-label="Rooms in Town brand mark">
        <div class="mark-wrap">
          <img src="assets/rooms-in-town-mark.svg" alt="An illustrated roofline of connected town houses">
          <p class="caption">Rooms · Places · Town</p>
        </div>
      </section>
    </main>

    <footer>
      <span>Rooms in Town</span>
      <span>Establishing the view</span>
    </footer>
  </div>
</body>
</html>
